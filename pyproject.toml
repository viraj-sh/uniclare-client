[project]
name = "uniclare-client"
version = "2.0.0"
description = "View data that is hidden on the Uniclare App or Student Portal."
readme = "README.md"
requires-python = ">=3.12.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=4.0.11",
]
cli = [
    "keyring>=25.7.0",
    "typer>=0.27.3",
]

[dependency-groups]
dev = []
