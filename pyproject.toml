[project]
name = "uniclare-client"
version = "2.1.0"
description = "View data that is hidden on the Uniclare App or Student Portal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "viraj-sh", email = "virajs45@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.0",
]

[project.scripts]
unicli = "uniclare_client.cli.entry:run"
unimcp = "uniclare_client.mcp_server.entry:run"

[project.optional-dependencies]
cli = [
    "keyring>=25.7.0",
    "typer>=0.27.3",
]
mcp = [
    "fastmcp>=4.0.11",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
