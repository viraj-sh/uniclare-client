[project]
name = "uniclare-client"
version = "3.0.0"
description = "View data that is hidden on the Uniclare App or Student Portal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "viraj-sh", email = "virajs45@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
]

[project.scripts]
unicli = "uniclare_client.interfaces.cli.entry:run"
unimcp = "uniclare_client.interfaces.mcp.entry:run"

[project.gui-scripts]
unigui = "uniclare_client.interfaces.desktop.entry:run"

[project.optional-dependencies]
cli = [
    "keyring>=25.7.0",
    "typer>=0.27.3",
]
mcp = [
    "fastmcp>=4.1.3",
]
desktop = [
    "platformdirs>=4.13.5",
    "pyqt6>=6.11.0",
    "pyqt6-webengine>=6.11.0",
    "pywebview>=6.2.1",
    "qtpy>=2.4.3",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "requirements-parser>=0.13.1",
]
